<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EGGBOY · Still Delivering</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f3d9b5; }
  body { font-family: "Noto Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif; color: #3b2a1a; }
  #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #f3d9b5; }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: #f3d9b5; color: #3b2a1a; font-size: 20px; letter-spacing: 1px;
  }
  #error {
    position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box; background: #f3d9b5; color: #8a2f25; font-size: 16px; text-align: center;
  }
</style>
</head>
<body>
<div id="loading">
  <div style="max-width: 600px; margin: 0 auto; padding: 0 24px; text-align: center;">
    <p style="font-size: 26px; font-weight: 600; margin: 0 0 36px 0; letter-spacing: 1px; color: #3b2a1a;">EGGBOY · Still Delivering</p>
    <p style="font-size: 16px; line-height: 1.9; margin: 0 0 28px 0; color: #6b4a2a; text-align: left; text-indent: 2em;">潮汐镇的人都搬走了，海水一天天涨上来。小机器人邮差 EGGBOY 还在送信：每封信寄给一个已经不在的人，靠收信人留下的东西，一站一站拼出他们的故事。最后一封信，是寄给它自己的。</p>
    <div style="width: 100%; height: 8px; background: rgba(59,42,26,0.15); border-radius: 4px; margin: 0 0 12px 0; overflow: hidden;">
      <div id="progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #ff9a4d, #ffb574); transition: width 0.2s;"></div>
    </div>
    <p id="loading-text" style="font-size: 15px; margin: 0 0 32px 0; color: #8a5a3a;">正在开机…</p>
    <p style="font-size: 13px; line-height: 1.7; margin: 0; color: #9a7a5a;">操作：WASD 移动，Shift 跑，空格跳，E 互动，M 地图，Esc 暂停</p>
  </div>
</div>
<canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1"></canvas>
<div id="error"></div>
<script src="Build/{{{ LOADER_FILENAME }}}"></script>
<script>
  const canvas = document.getElementById("unity-canvas");
  const loading = document.getElementById("loading");
  const error = document.getElementById("error");
  const config = {
    dataUrl: "Build/{{{ DATA_FILENAME }}}",
    frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
    codeUrl: "Build/{{{ CODE_FILENAME }}}",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "{{{ COMPANY_NAME }}}",
    productName: "{{{ PRODUCT_NAME }}}",
    productVersion: "{{{ PRODUCT_VERSION }}}",
    showBanner: false
  };
  // 2026-11-08：GitHub 单个文件不能超过 100 MB，发布时 tools/webgl_split.py 会把 data 文件切成几块，
  // 写一个 <data>.parts.json。有这个文件就先分块下载、在浏览器里拼回原文件再交给 Unity；没有就照常直接加载。
  async function resolveDataUrl() {
    let parts = null;
    try {
      const r = await fetch(config.dataUrl + ".parts.json", { cache: "no-cache" });
      if (r.ok) parts = await r.json();
    } catch (e) { parts = null; }
    if (!parts || !parts.files || !parts.files.length) return;
    const chunks = [];
    let got = 0;
    for (const name of parts.files) {
      const resp = await fetch("Build/" + name);
      if (!resp.ok) throw new Error("下载 " + name + " 失败（" + resp.status + "）");
      const reader = resp.body.getReader();
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        got += value.length;
        const pct = Math.round(got / parts.size * 100);
        document.getElementById("loading-text").textContent = "正在下载小镇… " + pct + "%";
        document.getElementById("progress-bar").style.width = pct + "%";
      }
    }
    config.dataUrl = URL.createObjectURL(new Blob(chunks));
  }
  resolveDataUrl().then(() => createUnityInstance(canvas, config, (progress) => {
    const pct = Math.round(progress * 100);
    document.getElementById("loading-text").textContent = "正在开机… " + pct + "%";
    document.getElementById("progress-bar").style.width = pct + "%";
  })).then(() => {
    loading.style.display = "none";
  }).catch((message) => {
    loading.style.display = "none";
    error.style.display = "flex";
    error.textContent = "加载失败：" + message;
  });
</script>
</body>
</html>
